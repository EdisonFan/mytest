name: asset-capture
on:
  push:
    paths:
      - '.github/workflows/asset-capture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture free public papers
        run: python3 probe_runner.py
      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "probe: capture public exam papers" || echo "nothing to commit"
          git push
