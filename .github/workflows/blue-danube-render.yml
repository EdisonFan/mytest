name: Render Blue Danube (real PD recording)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blue-danube-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 复用上一轮已上传的官方模板源码，只替换 Root / 封面 / props
      - name: Assemble variant project
        run: |
          rm -rf blue-danube-viz
          cp -r music-viz blue-danube-viz
          cp blue-danube-overrides/Root.tsx              blue-danube-viz/src/Root.tsx
          cp blue-danube-overrides/cover.jpeg            blue-danube-viz/public/blue-danube-cover.jpeg
          cp blue-danube-overrides/oscilloscope.json     blue-danube-viz/props/oscilloscope.json
          cp blue-danube-overrides/mirror-offset.json    blue-danube-viz/props/mirror-offset.json
          ls -lh blue-danube-viz/public/ blue-danube-viz/props/

      # 本地沙盒连不上 wikimedia.org，交给 runner 取真实录音。
      # 上次已把 PD 录音写回仓库，优先复用，避免 Commons 429 限流。
      - name: Fetch public-domain recording
        run: |
          mkdir -p rendered/blue-danube
          SRC=rendered/blue-danube/blue-danube-source.mp3
          if [ -f "$SRC" ] && [ "$(stat -c%s "$SRC")" -gt 500000 ]; then
            echo "复用仓库里已取得的 PD 录音 ($(stat -c%s "$SRC") B)"
            cp "$SRC" blue-danube-viz/public/blue-danube.mp3
          else
            python3 blue-danube-overrides/fetch_audio.py blue-danube-viz/public/blue-danube.mp3
          fi
          ls -lh blue-danube-viz/public/blue-danube.mp3

      - name: Save source audio for attribution
        run: |
          mkdir -p rendered/blue-danube
          cp blue-danube-viz/public/blue-danube.mp3 rendered/blue-danube/blue-danube-source.mp3
          cp blue-danube-overrides/ATTRIBUTION.md   rendered/blue-danube/ATTRIBUTION.md
          ls -lh rendered/blue-danube/

      - name: Install deps
        working-directory: blue-danube-viz
        run: npm i --no-audit --no-fund 2>&1 | tee ../npm-install.log

      - name: Ensure Chrome Headless Shell
        working-directory: blue-danube-viz
        run: npx remotion browser ensure

      - name: Render 1/3 · spectrum (official defaults, blue)
        working-directory: blue-danube-viz
        run: |
          mkdir -p out
          npx remotion render Visualizer out/01-spectrum.mp4 \
            --codec=h264 --gl=swiftshader --log=info 2>&1 | tee ../render-spectrum.log

      - name: Render 2/3 · oscilloscope (gold)
        working-directory: blue-danube-viz
        run: |
          npx remotion render Visualizer out/02-oscilloscope.mp4 \
            --props=props/oscilloscope.json \
            --codec=h264 --gl=swiftshader --log=info 2>&1 | tee ../render-oscilloscope.log

      - name: Render 3/3 · mirrored spectrum + audioOffset=20s
        working-directory: blue-danube-viz
        run: |
          npx remotion render Visualizer out/03-waltz-offset.mp4 \
            --props=props/mirror-offset.json \
            --codec=h264 --gl=swiftshader --log=info 2>&1 | tee ../render-waltz.log

      # 不用 ffprobe：runner 镜像里没有它（上一轮踩过），规格校验改在本地做
      - name: Collect outputs and logs
        if: always()
        run: |
          mkdir -p rendered/blue-danube
          cp blue-danube-viz/out/*.mp4 rendered/blue-danube/ 2>/dev/null || true
          cp blue-danube-viz/props/*.json rendered/blue-danube/ 2>/dev/null || true
          cp npm-install.log render-spectrum.log render-oscilloscope.log render-waltz.log \
             rendered/blue-danube/ 2>/dev/null || true
          cp blue-danube-overrides/Root.tsx rendered/blue-danube/Root.tsx 2>/dev/null || true
          cp blue-danube-viz/public/blue-danube-cover.jpeg rendered/blue-danube/cover.jpeg 2>/dev/null || true
          date -u +'%Y-%m-%dT%H:%M:%SZ' > rendered/blue-danube/rendered_at.txt
          ls -lh rendered/blue-danube/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rendered/blue-danube/
          git commit -m "Blue Danube music visualization demo outputs [skip ci]" || echo "no changes"
          git push
