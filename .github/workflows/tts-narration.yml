name: TTS Narration Worker

on:
  push:
    paths:
      - 'tts-worker/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts-narration
  cancel-in-progress: true

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Synthesize narration via Microsoft TTS
        run: |
          mkdir -p tts-output
          set +e
          python3 tts-worker/narration.py > tts-output/run.log 2>&1
          echo "EXIT=$?" >> tts-output/run.log
          cat tts-output/run.log

      - name: Save audio and logs back to repo
        if: always()
        run: |
          git config user.name "tts-worker"
          git config user.email "tts-worker@users.noreply.github.com"
          git add tts-output/run.log
          git add tts-output/narration.m4a 2>/dev/null || true
          git commit -m "TTS worker output" || echo "no change"
          git push
