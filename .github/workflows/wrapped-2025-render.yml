name: Render wrapped-2025 demo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      # checkout 本仓库，用于把成片写回 rendered/
      - uses: actions/checkout@v4
        with:
          path: mytest

      # 再 checkout 公开的上游 2025 项目到子目录
      - uses: actions/checkout@v4
        with:
          repository: JonnyBurger/wrapped-2025
          ref: main
          path: wrapped-2025

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (no lockfile in upstream, npm i)
        working-directory: wrapped-2025
        run: npm i --no-audit --no-fund

      - name: Ensure Chrome Headless Shell
        working-directory: wrapped-2025
        run: npx remotion browser ensure

      - name: Render MyComp (1080x1920 / 30fps / 400 frames)
        working-directory: wrapped-2025
        run: |
          mkdir -p out
          npx remotion render MyComp out/wrapped-2025.mp4 \
            --codec=h264 --gl=swiftshader --log=info

      - name: Write video back into mytest
        working-directory: mytest
        run: |
          mkdir -p rendered
          cp ../wrapped-2025/out/wrapped-2025.mp4 rendered/wrapped-2025-MyComp.mp4
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 rendered/wrapped-2025-MyComp.mp4 > rendered/wrapped-2025-ffprobe.txt || true
          date -u +'%Y-%m-%dT%H:%M:%SZ' > rendered/wrapped-2025-rendered_at.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered/
          git commit -m "Render JonnyBurger/wrapped-2025 demo [skip ci]" || echo "no changes"
          git push
