name: cnb-sync-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify CNB sync channel
        run: python3 probe_runner.py
      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "probe: verify CNB git-sync channel" || echo "nothing to commit"
          git push
