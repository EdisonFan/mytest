name: network-probe
on:
  push:
    paths:
      - '.github/workflows/network-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public endpoints from GitHub runner
        shell: bash
        run: |
          {
            echo "# 网络探测结果（由 GitHub Actions runner 执行）"
            echo ""
            echo "运行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Runner: $RUNNER_OS / $GITHUB_ACTOR"
            echo ""
            echo '| 目标 | HTTP | 字节 | 响应片段 |'
            echo '|---|---|---|---|'
            for u in \
              "https://gitee.com" \
              "https://gitee.com/api/v5/repos/oschina/git-osc" \
              "https://www.oschina.net" \
              "https://gitcode.com" \
              "https://cnb.cool" \
              "https://api.cnb.cool" \
              "https://docs.cnb.cool" \
              "https://www.shijuan1.com" \
              "http://cooco.net.cn" \
              "https://www.jiaoyanyun.com" \
              "https://www.jyeoo.com" \
              "https://github.com" ; do
              code=$(curl -sL -o /tmp/p.out -w '%{http_code}' --max-time 20 -A 'Mozilla/5.0' "$u" 2>/dev/null || echo ERR)
              size=$(wc -c < /tmp/p.out 2>/dev/null || echo 0)
              snippet=$(head -c 70 /tmp/p.out 2>/dev/null | tr -d '\n\r' | tr '|' '/' | tr -cd '[:print:]')
              echo "| $u | $code | $size | $snippet |"
            done
          } > probe-result.md
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-result.md
          git commit -m "probe: record runner network reachability" || echo "nothing to commit"
          git push
